<!DOCTYPE html>
<html>
<head>
    <title>Our Products</title>
</head>
<body>
    <h1>Our Products</h1>
    <p>These are our products.</p>

    {% for p in products %}
        <hr>

        <h2>Product {{ loop.index }}: {{ p.name }}</h2>

        <p>{{ p.description }}</p>

        <p>Price: ₹{{ p.price }}</p>

        <p>Available: {{ p.available }}</p>
    {% endfor %}

    <br>
    <a href="/logout">Back to Login</a>
</body>
</html>
